<p-table [value]="organizations()" [tableStyle]="{ 'min-width': '50rem' }">
  <ng-template #header>
    <tr>
      <th>Code</th>
      <th>Name</th>
      <th>Domain</th>
      <th>Tenant</th>
      <th>Action</th>
    </tr>
  </ng-template>
  <ng-template #body let-product>
    <tr>
      <td>{{ product.code }}</td>
      <td>{{ product.name }}</td>
      <td>{{ product.domain }}</td>
      <td>{{ product.tenant.name }}</td>
      <td><button>Edit</button></td>
    </tr>
  </ng-template>
</p-table>
